[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emomm-sequence"
version = "1.0.0"
description = "Text-driven music sequencing: training, evaluation, retrieval and deployment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "torch>=2.5",
  "transformers==4.57.6",
  "sentencepiece>=0.2",
  "requests>=2.31",
]

[project.optional-dependencies]
training = ["pandas>=2.2", "scikit-learn>=1.5", "librosa>=0.10", "nnAudio>=0.3", "soundfile>=0.12", "tqdm>=4.66"]
dev = ["pytest==8.3.5"]
report = ["lxml>=5.0", "Pillow>=10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
pythonpath = ["src"]
norecursedirs = ["artifacts", ".git"]
