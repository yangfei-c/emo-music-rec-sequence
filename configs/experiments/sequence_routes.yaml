  emotion_template: Music that sounds {phrase}.
  genre_template: Music in the {preference} style.
  instrument_template: Music featuring {preference}.
  phrase_indices_for_training:
  - 0
  - 1
  phrase_indices_for_evaluation:
  - 0
  - 1
  - 2
  pair_endpoint_phrase_indices: true
  states:
    low_v_low_a:
      target_va:
      - 0.25
      - 0.25
      phrases:
      - sad and low-energy
      - melancholic and subdued
      - gloomy and quiet
    low_v_high_a:
      target_va:
      - 0.25
      - 0.75
      phrases:
      - tense and high-energy
      - anxious and agitated
      - distressed and intense
    high_v_low_a:
      target_va:
      - 0.75
      - 0.25
      phrases:
      - relaxed and positive
      - peaceful and content
      - soothing and pleasant
    high_v_high_a:
      target_va:
      - 0.75
      - 0.75
      phrases:
      - happy and energetic
      - joyful and lively
      - cheerful and excited
frozen_objective:
  cosine_distance: (1 - cosine) / 2
  position_target: normalized_linear_interpolation_of_endpoint_text_embeddings
  zero_norm_policy: nearer_endpoint_start_on_tie
  weights:
    emotion: 0.5
    preference: 0.25
    smooth: 0.25
  no_preference_weights:
    emotion: 0.6666666666666666
    preference: 0.0
    smooth: 0.3333333333333333
  normalization: node_mean_and_edge_mean
  candidate_pool_reranking: false
  missing_or_failed_cost: 1.0
  supervised_va_used: false
endpoints:
  selection_scope: full_evaluation_bank
  top_per_endpoint: 20
  weights:
    emotion: 0.75
    preference: 0.25
  require_distinct_content_groups: true
  shared_across_candidate_methods: true
  counted_in_candidate_budget: true
  tie_break: track_id
planner:
  primary: beam
  beam_width: 50
  enforce_num_tracks: true
  enforce_unique_content: true
  fixed_endpoints: true
  include_last_edge: true
  hard_monotonicity_constraint: false
  hard_max_step_constraint: false
  request_timeout_seconds: 30
  exact_timeout_seconds: 60
