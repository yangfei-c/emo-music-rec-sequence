# 当前配置会先验证再执行全部启用实验；只查看计划时将 dry_run 改为 true。
mode: train  # smoke | train | evaluate
dry_run: false
evaluate_test: true

validations:
  enabled: true
  scripts:
    - validate_environment.py
    - validate_music_datasets.py
    - validate_metrics.py
    - validate_music_dataloaders.py
    - validate_music_model.py
    - validate_music_training.py
    - validate_text_data.py
    - validate_text_training.py
    - validate_training_engine.py

experiments:
  music_mtg_full183:
    enabled: true
  music_mtg_genre87:
    enabled: true
  music_mtg_instrument40:
    enabled: true
  music_mtg_mood56:
    enabled: true
  music_va_deam:
    enabled: true
  music_va_pmemo:
    enabled: true
  music_va_joint:
    enabled: true
  text_va:
    enabled: true

# 正式训练：mode=train、dry_run=false；每个实验可选 target_epochs/resume_from/init_weights。
# 只评估已有最佳模型：mode=evaluate、dry_run=false；每个实验可选 checkpoint，默认 latest。
# latest 会忽略 smoke_* 目录；如确需选择 smoke 结果，显式填写 checkpoint 路径。
