name: Ours-Route2
run_id: route2_uncertainty_20260926
seeds: [42, 43, 44]
device: cuda

data:
  sources:
    deam: artifacts/features/clamp3/clean/music_deam_clean.npz
    pmemo: artifacts/features/clamp3/clean/music_pmemo_clean.npz
  subsplit_seed: 20260906
  validation_fractions: [0.4, 0.3, 0.3]
  target_transform: "(va_targets_plus1_minus1 + 1) / 2"
  expected_counts:
    deam: {train: 1261, validation_model: 108, calibration: 81, policy: 82, test: 270}
    pmemo: {train: 527, validation_model: 46, calibration: 35, policy: 35, test: 115}

model:
  embedding_dim: 768
  hidden_dim: 128
  dropout: 0.1

training:
  max_epochs: 30
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  source_balanced_sampling: true
  selection_metric: validation_model_source_equal_pinball

calibration:
  partition: calibration
  alpha: 0.10
  score_unit: song_joint_valence_arousal
