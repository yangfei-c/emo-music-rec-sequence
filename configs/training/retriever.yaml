name: Ours
run_id: retraining_20260911
seed: 42
seeds: [42, 43, 44]
device: cuda

backbone:
  name: CLaMP3-SAAS
  frozen: true
  embedding_dim: 768
  checkpoint: artifacts/models/clamp3.pt
  repository_commit: 9016d2b0c8d12d1aa79c2e0ab201e6822bdc83a8
  checkpoint_sha256: 5033f868e3977be3945ee416b5a1718d5589a173c7ba8982231d8c94a6441d80

model:
  factors: [semantic, affect, preference]
  bottleneck_dim: 64
  dropout: 0.1
  adapter_drop_probability: 0.0
  adapter_drop_probabilities:
    semantic: 0.0
    affect: 0.0
    preference: 0.0
  initial_adapter_scale: 0.1
  adapter_sharing: none
  initial_factor_weights: [1.0, 1.0, 1.0]
  train_factor_weights: false
  initial_temperature: 0.07
  semantic_output_blend: 1.0
  affect_output_blend: 1.0
  preference_output_blend: 1.0

supervision:
  semantic_pairs:
    - artifacts/features/clamp3/clean/pairs_merge_clean.npz
    - artifacts/features/clamp3/clean/pairs_song_describer_clean.npz
  text_va: artifacts/features/clamp3/text_emobank.npz
  music_va:
    - artifacts/features/clamp3/clean/music_deam_clean.npz
    - artifacts/features/clamp3/clean/music_pmemo_clean.npz
  mtg_factors: artifacts/features/clamp3/clean/mtg_factor_supervision_clean.npz
  music_index: artifacts/catalog/music.npz
  preference_prefixes: [genre---, instrument---]
  affect_prefixes: [mood/theme---]
  min_train_tracks_per_label: 50
  min_train_artists_per_label: 20

loss:
  semantic_weight: 1.0
  semantic_distillation_weight: 0.0
  semantic_distillation_temperature: 0.07
  semantic_temperature_modulation: false
  semantic_modulation_minimum_temperature: 0.01
  semantic_modulation_range: 0.04
  semantic_modulation_schedule_power: 2.0
  semantic_smooth_target_mix: 0.0
  semantic_smooth_target_fraction: 0.1
  semantic_smooth_target_text_weight: 0.5
  semantic_smooth_target_temperature: 0.07
  preference_weight: 1.0
  affect_tag_weight: 1.0
  tag_loss: contrastive
  preference_db_mix: 0.0
  affect_db_mix: 0.0
  preference_dr_mix: 0.0
  affect_dr_mix: 0.0
  preference_mpm_mix: 0.0
  affect_mpm_mix: 0.0
  mpm_margin: 0.05
  mpm_label_smoothing: 0.0
  preference_two_way_mix: 0.0
  affect_two_way_mix: 0.0
  two_way_positive_temperature: 4.0
  two_way_negative_temperature: 1.0
  preference_sigmoid_mix: 0.0
  affect_sigmoid_mix: 0.0
  preference_sigmoid_bias: -3.5
  affect_sigmoid_bias: -4.5
  preference_lambda_ndcg_mix: 0.0
  affect_lambda_ndcg_mix: 0.0
  lambda_ndcg_cutoff: 10
  lambda_ndcg_sigma: 1.0
  preference_smooth_ap_mix: 0.0
  affect_smooth_ap_mix: 0.0
  smooth_ap_temperature: 0.01
  preference_circle_mix: 0.0
  affect_circle_mix: 0.0
  circle_margin: 0.25
  circle_gamma: 32.0
  preference_plm_mix: 0.0
  affect_plm_mix: 0.0
  plm_balance_strength: 1.0
  plm_minimum_keep_probability: 0.05
  preference_track_contrastive_weight: 0.0
  affect_track_contrastive_weight: 0.0
  track_contrastive_temperature: 0.1
  track_contrastive_overlap: binary
  preference_frozen_track_contrastive_weight: 0.0
  affect_frozen_track_contrastive_weight: 0.0
  frozen_track_contrastive_temperature: 0.07
  frozen_track_contrastive_overlap: jaccard
  frozen_track_contrastive_normalize_targets: false
  preference_labeled_tracks_only: false
  affect_labeled_tracks_only: false
  preference_label_to_track_weight: 0.5
  affect_label_to_track_weight: 0.5
  preference_false_negative_fraction: 0.0
  affect_false_negative_fraction: 0.0
  false_negative_warmup_epochs: 1
  affect_group_chain_weight: 0.0
  affect_group_chain_top_k: 3
  affect_group_chain_temperature: 0.1
  asl_mix: 0.25
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_probability_margin: 0.05
  asl_prior_strength: 1.0
  asl_reduction: mean_samples_sum_labels
  asl_detach_focal_weight: true
  db_map_alpha: 0.1
  db_map_beta: 10.0
  db_map_gamma: 0.2
  db_negative_scale: 2.0
  db_initial_bias_scale: 0.05
  db_focal_gamma: 2.0
  db_focal_balance: 2.0
  db_reduction: mean
  dr_pair_scale: 1.0
  dr_negative_scale: 1.0
  dr_reduction: mean
  asl_dynamic: false
  asl_dynamic_initial_gamma_neg: 0.0
  asl_target_gap: 0.1
  asl_step_size: 0.01
  asl_min_gamma_neg: 0.0
  asl_max_gamma_neg: 20.0
  text_va_weight: 0.25
  music_va_weight: 0.5
  cross_modal_va_weight: 0.0
  cross_modal_va_temperature: 0.1
  counterfactual_weight: 0.0
  factor_separation_weight: 0.0
  gate_prior_weight: 0.0
  counterfactual_margin: 0.1
  ccc_weight: 0.1
  huber_beta: 0.1

training:
  # Optional factor-specific tower freezes used by controlled diagnostics.
  freeze_text_adapters: []
  freeze_music_adapters: []
  max_epochs: 25
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0005
  batch_size_pairs: 128
  batch_size_mtg: 256
  batch_size_va: 128
  learning_rate: 0.0003
  semantic_learning_rate: 0.0003
  semantic_pair_sampling: cycle
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  gradient_clip_mode: global
  temperature_control:
    semantic:
      mode: learned
      start: 0.07
      end: 0.07
    affect:
      mode: learned
      start: 0.07
      end: 0.07
    preference:
      mode: learned
      start: 0.07
      end: 0.07
  amp: true

evaluation:
  retrieval_ks: [1, 5, 10]
  tag_ks: [5, 10, 20]
  selection_metric: validation_composite
  bootstrap_samples: 1000
  counterfactual_queries: 256
  counterfactual_seed: 2026
  test_once: true
  baseline: CLaMP3
